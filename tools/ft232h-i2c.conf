# ftdi_eeprom --flash-eeprom tools/ft232h-i2c.conf
# Example of optimal settings for i2c ft232h
# that leads to an automatic probing of the kernel ftdi driver:
# "I2C" in the product string selects I2C mode (auto mode checks it
# before the VCP driver bit, which ftdi_eeprom sets by default).
#
# To state the mode without touching the product string, store the tag
# "bus_mode=i2c" in the user area instead (README, "EEPROM bus_mode=
# tag"):
#   printf 'bus_mode=i2c\0' > bus_mode.bin
#   user_data_addr=0x20
#   user_data_file="bus_mode.bin"
vendor_id=0x0403
product_id=0x6014
manufacturer="Acme demo"
product="FT232H adafruit I2C"
use_serial=true
serial="ACME-0001" # XXX should be unique, TODO extend ftdi_eeprom to generated a uuid
self_powered=false
remote_wakeup=false
max_power=500

# Be aware that for FT232H: group0=ACBUS, group1=ADBUS (data bus for I2C)
group1_drive=8MA
group1_schmitt=true
group1_slew=slow
